# Mantém a API acordada: o Render grátis dorme após 15 min sem acesso e a primeira
# pergunta depois disso esperava ~1 min. Reserva do monitor do UptimeRobot (a cada 5 min).
# O GitHub pode atrasar agendamentos e pausa este depois de 60 dias sem commits no repositório.
name: Manter servidor acordado

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Acessar /health
        env:
          HEALTH_URL: https://estudo-api-1k65.onrender.com/health
        run: |
          # Acordando do zero o Render leva até ~1 min; se falhar 3 vezes, o GitHub avisa por e-mail.
          curl --fail --silent --show-error --max-time 90 \
               --retry 2 --retry-delay 10 --retry-all-errors \
               --output /dev/null --write-out "HTTP %{http_code} em %{time_total}s\n" \
               "$HEALTH_URL"
